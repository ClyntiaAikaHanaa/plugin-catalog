name: Sync plugin repos

# Pemindaian akun untuk menemukan repo plugin baru dan rilis yang terlewat.
#
# Ini JARING PENGAMAN, bukan jalur utama. Jalur utamanya tetap
# `on-plugin-release.yml`, yang jalan dalam hitungan detik setelah tag di-push
# dan tahu apakah rilisnya breaking. Sinkronisasi ini menangkap kasus yang
# lolos: dispatch gagal terkirim, token kedaluwarsa, atau repo plugin baru yang
# belum sempat kamu pasangi workflow rilis.

on:
  schedule:
    # Tiap hari 04:00 UTC (11:00 WIB).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — hanya tampilkan apa yang akan berubah, tanpa menulis atau deploy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sama seperti `on-plugin-release.yml`: push oleh `GITHUB_TOKEN` tidak
    # memicu workflow lain, jadi deploy harus dilakukan di sini.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Scan repos and ingest releases
        env:
          # `GITHUB_TOKEN` bawaan cukup untuk membaca repo publik milik akun
          # ini. Untuk repo privat, ganti dengan PAT yang punya akses baca.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-repos.mjs \
            --owner "${{ github.repository_owner }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Gerbang yang sama dengan jalur dispatch: katalog rusak tidak di-deploy.
      - name: Validate
        if: ${{ !inputs.dry_run }}
        run: npm run validate

      - name: Build catalog
        if: ${{ !inputs.dry_run }}
        run: npm run build

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add src/plugins
          if git diff --cached --quiet; then
            echo "katalog sudah sinkron, tidak ada perubahan"
            exit 0
          fi
          git commit -m "catalog: sinkronisasi terjadwal"
          git push

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !inputs.dry_run }}
        with:
          path: dist
      - id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
